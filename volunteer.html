<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Registration - Absahnaz Care Foundation</title>
<style>
body {
font-family: Arial, sans-serif;
background: #e8f5ef;
margin: 0;
padding: 20px;
}
.container {
max-width: 550px;
margin: 20px auto;
background: white;
padding: 25px;
border-radius: 10px;
}
h1, h2 {
color: #075b45;
text-align: center;
}
label {
display: block;
margin-top: 15px;
font-weight: bold;
}
input, select, textarea {
width: 100%;
padding: 12px;
margin-top: 6px;
border: 1px solid #ccc;
border-radius: 5px;
box-sizing: border-box;
}
button {
width: 100%;
padding: 14px;
margin-top: 20px;
background: #075b45;
color: white;
border: none;
border-radius: 5px;
font-size: 16px;
}
.note {
font-size: 13px;
color: #555;
}
</style>
</head>
<body>

<div class="container">

<h1>ABSAHNAZ CARE FOUNDATION</h1>
<h2>Volunteer Registration Form</h2>

<p>Thank you for your interest in supporting vulnerable children. Please complete this form to express your interest in volunteering.</p>

<form id="volunteerForm">

<label>Full Name</label>
<input type="text" name="text" placeholder="Enter your full name" required>

<label>Phone Number</label>
<input type="tel" name="phone" placeholder="Enter your phone number" required>

<label>Email Address (Optional)</label>
<input type="email" name="email" placeholder="Enter your email">

<label>State and Location</label>
<input type="text" name="location" placeholder="Enter your location" required>

<label>Area of Interest</label>
<select name="interest" required>
<option value="">Select an area</option>
<option>Educational Support</option>
<option>Child Welfare</option>
<option>Community Outreach</option>
<option>Fundraising</option>
<option>General Volunteering</option>
</select>

<label>Why do you want to volunteer?</label>
<textarea name="reason" rows="4" placeholder="Tell us why you want to volunteer"></textarea>

<p class="note">Your information will be used only to respond to your volunteer enquiry.</p>

<button type="submit">Submit Volunteer Interest</button>

</form>

<p style="text-align:center;">
<a href="index.html">Back to Home</a>
</p>

</div>
  <script>
document.getElementById("volunteerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const form = event.target;

    const name = form.querySelector('[name="text"]').value.trim();
    const phone = form.querySelector('[name="phone"]').value.trim();
    const email = form.querySelector('[name="email"]').value.trim();
    const location = form.querySelector('[name="location"]').value.trim();
    const interest = form.querySelector('[name="interest"]').value;
    const reason = form.querySelector('[name="reason"]').value.trim();

    const message =
`NEW VOLUNTEER APPLICATION
Absahnaz Care Foundation

Full Name: ${name}
Phone Number: ${phone}
Email: ${email || "Not provided"}
Location: ${location}
Area of Interest: ${interest}
Reason for Volunteering: ${reason || "Not provided"}`;

    const whatsappURL = "https://wa.me/2349075839964?text=" + encodeURIComponent(message);

    window.location.href = whatsappURL;
});
</script>
</body>
</html>
